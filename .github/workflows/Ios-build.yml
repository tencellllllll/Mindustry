name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Robovm / Build iOS App
        run: |
          chmod +x ./gradlew
          ./gradlew :ios:deploy

      - name: Package IPA
        run: |
          mkdir -p build/ipa
          find ios/build -name "*.app" -exec zip -r build/ipa/Mindustry.ipa {} \;

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: build/ipa/Mindustry.ipa
